<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <link rel="stylesheet" type="text/css" href="/css/register.css">
</head>
<body>
<div class="register-form">
    <h2>Регистрация</h2>
    <form action="/register" method="post" th:object="${registrationDto}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="text" th:field="*{name}" placeholder="Имя" required>
        <input type="email" th:field="*{email}" placeholder="Email" required>
        <input type="password" th:field="*{password}" placeholder="Пароль" required>
        <input type="password" th:field="*{confirmPassword}" placeholder="Подтвердите пароль" required>
        <button type="submit">Зарегистрироваться</button>
    </form>
    <div th:if="${error}" class="error" th:text="${error}"></div>
    <a href="/login">Уже есть аккаунт? Войти</a>
</div>
</body>
</html>
