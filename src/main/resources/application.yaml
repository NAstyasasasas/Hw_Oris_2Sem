spring:
  application:
    name: HwOne
  datasource:
    url: jdbc:postgresql://localhost:5432/hw_dao
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      pool-name: HwOneHikariPool
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

info:
  app:
    name: ${spring.application.name}
    version: 1.0.0
    description: Homework project with Actuator

management:
  endpoints:
    web:
      exposure:
        include: "*"
  info:
    env:
      enabled: true